spring.application.name=RecallFlow

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/recallflow_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=RecallFlowSuperSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm2024!
app.jwt.expiration=86400000

# Server
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Logging
logging.level.com.recallflow=DEBUG
logging.level.org.springframework.security=WARN
